[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmind-mcp"
version = "2.0.0"
description = "XMind MCP Server - 思维导图创建/分析/转换（别名兼容、递归列举）"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "XMind MCP Project", email = "xmind-mcp@example.com"},
]
keywords = ["xmind", "mindmap", "mcp", "ai", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "beautifulsoup4",
    "python-docx",
    "openpyxl",
    "deep-translator>=1.11.4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7", "packaging>=24"]

[project.urls]
Homepage = "https://github.com/Master-Frank/XmindMcp"
Repository = "https://github.com/Master-Frank/XmindMcp.git"
Issues = "https://github.com/Master-Frank/XmindMcp/issues"

[project.scripts]
xmind-mcp-server = "xmind_mcp.cli:main"
xmind-mcp = "xmind_mcp.cli:main"
xmind-convert = "xmind_mcp.cli:convert_main"

[tool.hatch.build.targets.wheel]
packages = ["xmind_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "xmind_mcp/**",
    "README.md",
    "LICENSE",
    "requirements.txt",
    "tests/**",
    "examples/**",
    ".github/workflows/*.yml",
    ".github/scripts/*.py",
    "docs/**",
    "README_CN.md",
    "UVX_DEPLOYMENT_GUIDE.md",
    "configs/mcp_config.json",
]
